name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el mod
        run: |
          unzip -oq ./*.zip -d mod
          echo "MOD_DIR=$(dirname "$(find mod -name build.gradle | head -1)")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 4.10.3
          cache-disabled: true

      - name: Compilar
        working-directory: ${{ env.MOD_DIR }}
        run: |
          set +e
          gradle build --no-daemon --stacktrace > build.log 2>&1
          code=$?
          {
            echo '## Errores del build'
            echo '```'
            grep -E "error:|What went wrong|Could not|Execution failed|symbol:|location:" -A3 build.log | head -80
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ${{ env.MOD_DIR }}/build.log

      - uses: actions/upload-artifact@v4
        with:
          name: omnitrix-ultimate-jar
          path: ${{ env.MOD_DIR }}/build/libs/*.jar
